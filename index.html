<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS Serverless To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>My To-Do List</h1>
            <p>AWS Serverless Application</p>
        </header>

        <section class="todo-form">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </section>

        <section>

            <h2>Tasks</h2>

            <div id="loading">
                Loading tasks...
            </div>

            <ul id="todoList"></ul>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
